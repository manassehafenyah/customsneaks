# CustomSneaks GH — admin
#
# Two lines to check if you ever move the repo or the sign-in Worker:
#   repo      — your GitHub username / repository
#   base_url  — the Cloudflare Worker that signs you in

backend:
  name: github
  repo: manassehafenyah/customsneaks
  branch: main
  base_url: https://sveltia-cms-auth.manassehafenyah.workers.dev

media_folder: assets/img
public_folder: /assets/img

collections:
  - name: products
    label: Products
    files:
      - name: catalogue
        label: The vault
        file: data/products.json
        description: Everything on the shop. Drag pairs to reorder — the top one shows first.
        fields:
          - name: products
            label: Pairs
            label_singular: pair
            widget: list
            collapsed: true
            summary: "{{fields.name}} — {{fields.colorway}} · GH₵{{fields.price}}"
            fields:

              - name: name
                label: Model
                widget: string
                hint: "Air Force 1 '07, Air Jordan 4 Retro…"

              - name: colorway
                label: Colorway
                widget: string
                required: false
                hint: Triple White, Bred, Floral Denim…

              - name: price
                label: Price (GH₵)
                widget: number
                value_type: int
                min: 0
                hint: Digits only. The shop adds the GH₵ and the comma.

              - name: sizes
                label: Sizes available
                widget: select
                multiple: true
                required: false
                hint: Tick every size you have. Untick one when it sells.
                options:
                  ["5","5.5","6","6.5","7","7.5","8","8.5","9","9.5",
                   "10","10.5","11","11.5","12","12.5","13","14"]

              - name: images
                label: Photos
                widget: list
                required: false
                hint: First photo is the one on the card. Drag to reorder.
                field: { name: src, label: Photo, widget: image }

              - name: video
                label: Short clip
                widget: file
                required: false
                media_library: { config: { max_file_size: 10485760 } }
                hint: Optional. MP4, a few seconds, under 10 MB.

              - name: category
                label: Category
                widget: select
                default: custom
                options:
                  - { label: Customs, value: custom }
                  - { label: Air Force 1, value: af1 }
                  - { label: Jordan, value: jordan }
                  - { label: Dunk, value: dunk }
                  - { label: Air Max, value: airmax }
                  - { label: Other, value: other }

              - name: visible
                label: Show on the shop
                widget: boolean
                default: true

              - name: badge
                label: Corner badge
                widget: string
                required: false
                hint: "Grail, 1 of 1, New in — leave empty for none."

              - name: details
                label: Extra details
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: condition, label: Condition, widget: string, required: false, default: Deadstock }
                  - { name: styleCode, label: Style code, widget: string, required: false }
                  - { name: year, label: Release year, widget: string, required: false }

  - name: settings
    label: Shop settings
    files:
      - name: shop
        label: Contact, drop & front page
        file: data/settings.json
        fields:
          - { name: shopName, label: Shop name, widget: string }
          - { name: tagline, label: Tagline (browser tab), widget: string, required: false }
          - name: whatsapp
            label: WhatsApp number
            widget: string
            pattern: ['^[0-9]{9,15}$', 'Digits only with country code — e.g. 233244906925']
          - { name: phone, label: Phone number (for calls), widget: string }
          - { name: heroEyebrow, label: Small line above the headline, widget: string }
          - { name: heroLine1, label: Headline — first line, widget: string }
          - { name: heroLine2, label: Headline — coloured line, widget: string }
          - { name: heroLede, label: Intro paragraph, widget: text }
          - { name: dropName, label: Next drop — headline, widget: string, required: false }
          - { name: dropSub, label: Next drop — details line, widget: string, required: false }
          - { name: dropPairs, label: Next drop — number of pairs, widget: string, required: false }
          - { name: dropAt, label: Countdown target, widget: datetime, required: false }
          - { name: deliveryNote, label: Delivery note (in the cart), widget: text }
          - { name: footerNote, label: Footer line, widget: string }
          - name: ticker
            label: Ticker messages
            widget: list
            field: { name: line, label: Message, widget: string }
